<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lotka-Volterra Ecosystem - 3D Observer</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; overflow: hidden; background: #091019; color: #e6edf3;
         font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  #world { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .panel { background: rgba(7, 14, 21, .82); border: 1px solid rgba(168, 200, 164, .22);
           border-radius: 8px; box-shadow: 0 5px 18px rgba(0, 0, 0, .25);
           backdrop-filter: blur(5px); }
  #title { position: fixed; top: 14px; left: 14px; padding: 11px 14px; }
  h1 { margin: 0; color: #f0f6e9; font-size: 15px; font-weight: 650; }
  .dim, .muted { color: #9aa99f; }
  .dim { margin-top: 5px; font-size: 11px; line-height: 1.55; }
  #hud { position: fixed; top: 14px; right: 14px; min-width: 168px; padding: 11px 14px;
         font-size: 12px; line-height: 1.65; }
  #inspect { position: fixed; right: 14px; bottom: 14px; width: min(430px, calc(100vw - 28px));
             max-height: 47vh; overflow: auto; padding: 11px 13px; font-size: 11px; line-height: 1.5; }
  #inspect h2 { margin: 0 0 5px; font-size: 12px; }
  #inspect table { border-collapse: collapse; }
  #inspect td { padding: 1px 8px 1px 0; }
  #chartWrap { position: fixed; left: 14px; bottom: 14px; padding: 8px; }
  #chart { display: block; width: min(360px, calc(100vw - 28px)); height: 155px; }
  #crosshair { position: fixed; left: 50%; top: 50%; width: 17px; height: 17px;
               margin: -8px 0 0 -8px; pointer-events: none; opacity: .8; }
  #crosshair::before, #crosshair::after { position: absolute; content: ""; background: #f8f1ca; }
  #crosshair::before { left: 8px; top: 1px; width: 1px; height: 15px; }
  #crosshair::after { left: 1px; top: 8px; width: 15px; height: 1px; }
  #lockHint { position: fixed; left: 50%; top: calc(50% + 22px); transform: translateX(-50%);
              color: #f8f1ca; font-size: 11px; text-shadow: 0 1px 4px #000; pointer-events: none; }
  .grass { color: #70d36b; } .rab { color: #f4ead9; } .fox { color: #ff8172; }
  .k { color: #9aa99f; } .chosen { color: #f2bf55; font-weight: 650; }
  .bar { display: inline-block; height: 8px; background: #5188c7; border-radius: 2px;
         vertical-align: middle; }
  .chosen .bar { background: #f2bf55; }
  @media (max-width: 760px) {
    #chartWrap { display: none; }
    #inspect { max-height: 38vh; }
  }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.js" } }
</script>
</head>
<body>
<canvas id="world"></canvas>
<div id="title" class="panel">
  <h1>Lotka-Volterra Ecosystem - 3D Observer</h1>
  <div class="dim">animated mutants hunt procedural rabbits across live policy state<br>
    click to fly - <b>WASD</b> move - <b>R/F</b> rise/fall - <b>shift</b> boost - <b>E</b> inspect - <b>+/-</b> speed</div>
</div>
<div id="hud" class="panel"></div>
<div id="chartWrap" class="panel"><canvas id="chart" width="360" height="155"></canvas></div>
<div id="inspect" class="panel">aim at an entity and press <b>E</b> to inspect its live state</div>
<div id="crosshair"></div>
<div id="lockHint">click scene to capture fly camera</div>
<script type="module" src="./eco_viewer.js"></script>
</body>
</html>
